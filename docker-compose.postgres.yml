# Opcional: base PostgreSQL para producción/pruebas.
# Uso: docker compose -f docker-compose.postgres.yml up -d
# Después: ./scripts/switch-db.sh postgresql "postgresql://printflow:printflow@localhost:5432/printflow?schema=public"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: printflow
      POSTGRES_PASSWORD: printflow
      POSTGRES_DB: printflow
    ports:
      - "5432:5432"
    volumes:
      - printflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  printflow_pgdata:
